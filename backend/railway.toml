# Railway service settings (Root Directory must be `backend`).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations are NOT run on boot (see Dockerfile). Apply with:
#   python -m app.db.migrate
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
