# Railway service settings (Root Directory must be `backend`).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Inline PORT — no shell expansion, no extra module required.
startCommand = "python -c \"import os, uvicorn; uvicorn.run('app.main:app', host='0.0.0.0', port=int(os.environ.get('PORT', '8000')))\""
restartPolicyType = "ON_FAILURE"
